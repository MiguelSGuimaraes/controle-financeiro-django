
{% extends 'financas/base.html' %}

{% block conteudo %}

<style>
    .conta-form-container {
        max-width: 650px;
        margin: 28px auto;
    }

    .conta-form-card {
        background: #1C2340;
        border: 1px solid #303858;
        border-radius: 14px;
        padding: 30px;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
    }

    .conta-form-card h2 {
        color: #F1F2FA;
        margin: 0 0 26px;
        font-size: 22px;
    }

    .conta-form-card form p {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin-bottom: 20px;
    }

    .conta-form-card label {
        color: #D5D9EB;
        font-size: 14px;
        font-weight: 600;
    }

    .conta-form-card input,
    .conta-form-card select,
    .conta-form-card textarea {
        width: 100%;
        box-sizing: border-box;
        background: #11182F;
        color: #F1F2FA;
        border: 1px solid #3A4568;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 14px;
        color-scheme: dark;
    }

    .conta-form-card input:focus,
    .conta-form-card select:focus,
    .conta-form-card textarea:focus {
        outline: none;
        border-color: #8175F0;
        box-shadow: 0 0 0 3px rgba(129, 117, 240, 0.15);
    }

    .conta-form-card select option {
        background: #1C2340;
        color: #F1F2FA;
    }

    .conta-form-card input[type="checkbox"] {
        width: auto;
        accent-color: #7669E8;
    }

    .conta-form-card .helptext {
        color: #A4ABC5;
        font-size: 12px;
    }

    .conta-form-card .errorlist {
        color: #F87171;
        font-size: 13px;
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .acoes-form {
        display: flex;
        gap: 12px;
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #303858;
    }

    @media (max-width: 600px) {
        .conta-form-card {
            padding: 20px;
        }

        .acoes-form {
            flex-direction: column;
        }

        .acoes-form .btn {
            width: 100%;
            text-align: center;
        }
    }
</style>

<div class="conta-form-container">

    <div class="conta-form-card">

        <h2>
            {% if form.instance.pk %}
                Editar Conta
            {% else %}
                Nova Conta
            {% endif %}
        </h2>

        <form method="post" class="form">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="acoes-form">

                <button type="submit" class="btn btn-primary">
                    Salvar
                </button>

                <a href="{% url 'lista_contas' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </div>
        </form>

    </div>

</div>

{% endblock %}
