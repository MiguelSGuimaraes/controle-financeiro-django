
{% extends 'financas/base.html' %}

{% block conteudo %}
<div class="page-header">
    <h2>Minhas Categorias</h2>
    <a href="{% url 'criar_categoria' %}" class="btn btn-primary">+ Nova Categoria</a>
</div>

<table class="tabela">
    <tr>
        <th>Nome</th>
        <th>Tipo</th>
        <th>Ações</th>
    </tr>

    {% for categoria in categorias %}
    <tr>
        <td>{{ categoria.nome }}</td>
        <td>{{ categoria.get_tipo_display }}</td>
        <td class="acoes">
            <a href="{% url 'editar_categoria' categoria.pk %}">Editar</a>
            <a href="{% url 'excluir_categoria' categoria.pk %}" class="link-excluir">Excluir</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="3" class="vazio">
            Nenhuma categoria cadastrada ainda.
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
